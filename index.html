<!DOCTYPE html>

<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mapillary 360 Crawler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>Mapillary 360 Crawler</h1>

  <section class="panel">
    <h2>Worker</h2>
    <input id="workerUrl" type="text" value="https://mapillary360.grozsa11.workers.dev">
  </section>

  <section class="panel">
    <h2>Kezdő terület</h2>

```
<div class="grid">
  <label>
    Min. longitude
    <input id="minLon" type="number" step="0.0001" value="19.039">
  </label>

  <label>
    Min. latitude
    <input id="minLat" type="number" step="0.0001" value="47.629">
  </label>

  <label>
    Max. longitude
    <input id="maxLon" type="number" step="0.0001" value="19.040">
  </label>

  <label>
    Max. latitude
    <input id="maxLat" type="number" step="0.0001" value="47.630">
  </label>
</div>

<div id="areaInfo" class="area-info"></div>

<div class="buttons">
  <button id="startBtn">START</button>
  <button id="pauseBtn">PAUSE</button>
  <button id="stopBtn">STOP</button>
  <button id="resetBtn">RESET</button>
</div>
```

  </section>

  <section class="stats">

```
<div class="stat">
  <span>Queue</span>
  <strong id="queueCount">0</strong>
</div>

<div class="stat">
  <span>Visited</span>
  <strong id="visitedCount">0</strong>
</div>

<div class="stat">
  <span>Stored</span>
  <strong id="storedCount">0</strong>
</div>

<div class="stat">
  <span>Splits</span>
  <strong id="splitCount">0</strong>
</div>

<div class="stat">
  <span>Errors</span>
  <strong id="errorCount">0</strong>
</div>
```

  </section>

  <section class="panel">
    <h2>Aktuális terület</h2>
    <pre id="current">-</pre>
  </section>

  <section class="panel">
    <h2>Log</h2>
    <div id="log"></div>
  </section>

</div>

<script src="crawler.js"></script>

</body>
</html>
